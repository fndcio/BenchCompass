# Backport Verify Pipeline — Faz 2 Evrim Motoru
# docs/process/lessons-learned-*.md veya AGENTS.md §7 değişince çalışır.
# extract_lessons.py ile backport önerilerini üret + doğrula.
name: Backport Verify (Faz 2)

on:
  pull_request:
    branches: [main, master]
    paths:
      - "docs/process/lessons-learned-*.md"
      - "AGENTS.md"
      - "scripts/extract_lessons.py"
  schedule:
    # Her Pazar gece 02:00 UTC — haftalık backport tarama
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  extract-and-verify:
    name: "Faz 2: Backport Öneri Motoru"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: extract_lessons.py çalıştır
        run: |
          python scripts/extract_lessons.py report --json > backport-proposals.json
          cat backport-proposals.json

      - name: Öneri özeti
        run: |
          echo "## 🧬 Backport Önerileri (Faz 2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          data = json.load(open('backport-proposals.json'))
          print(f'- Taranan ders: {data[\"lessons_total\"]} (genel geçerli: {data[\"lessons_generalizable\"]})')
          print(f'- Taranan yasak: {data[\"bans_total\"]} (genel geçerli: {data[\"bans_generalizable\"]})')
          new = [p for p in data['proposals'] if not p['already_in_master']]
          print(f'- **Backport'a uygun yeni öneri: {len(new)}**')
          if new:
              print('')
              for p in new:
                  print(f'  - [{p[\"kind\"]}] {p[\"title\"]} (skor {p[\"generalizability_score\"]})')
          " >> $GITHUB_STEP_SUMMARY

      - name: Backport önerisi varsa artifact yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backport-proposals-${{ github.run_id }}
          path: backport-proposals.json
          retention-days: 30

      - name: Doğrulama — genel geçerli öneri varsa PR yorumu
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('backport-proposals.json', 'utf8'));
            const newProposals = data.proposals.filter(p => !p.already_in_master);
            if (newProposals.length === 0) {
              console.log('Backport\'a uygun yeni öneri yok.');
              return;
            }
            const body = [
              '## 🧬 Faz 2: Backport Önerileri',
              '',
              `Bu PR'da **${newProposals.length} genel-geçerli öğe** tespit edildi.`,
              'Bunlar master template'e backport için aday:',
              ''
            ];
            for (const p of newProposals) {
              body.push(`- [${p.kind}] **${p.title}** (skor ${p.generalizability_score})`);
              body.push(`  - Hedef: \`${p.target_file}\``);
            }
            body.push('', '> Review sonrası: `/backport` komutu veya `extract_lessons.py apply` ile master'a gönder.');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join('\n')
            });
