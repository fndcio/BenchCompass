# Telemetry Aggregation Pipeline — Faz 4: Çocuk sinyallerinden master insight
# Her Pazartesi 04:00 UTC — haftalık agregasyon (master repo'sunda çalışır)
name: Telemetry Aggregate (Faz 4)

on:
  schedule:
    - cron: "0 4 * * 1"  # her Pazartesi 04:00 UTC
  push:
    branches: [main, master]
    paths:
      - "docs/telemetry/inbox/**"
      - "scripts/master_aggregate.py"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  ingest-and-aggregate:
    name: "Faz 4: Çocuk Sinyali Agregasyonu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inbox'taki sinyalleri işle
        run: python scripts/master_aggregate.py ingest

      - name: Insight üret
        run: |
          python scripts/master_aggregate.py report
          python scripts/master_aggregate.py report --json > docs/telemetry/insights.json

      - name: Özet
        run: |
          echo "## 📡 Faz 4: Telemetri Agregasyonu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          data = json.load(open('docs/telemetry/insights.json'))
          print(f'- Toplam çocuk: {data[\"child_count\"]}')
          print(f'- İşlenen haftalar: {len(data[\"weeks_covered\"])}')
          if data['recommendations']:
              print('')
              print('### Master evrim önerileri')
              for r in data['recommendations']:
                  print(f'- {r}')
          " >> $GITHUB_STEP_SUMMARY

      - name: Insights.json commit
        run: |
          git config user.name "faz4-bot"
          git config user.email "faz4-bot@users.noreply.github.com"
          git add docs/telemetry/
          git diff --staged --quiet || git commit -m "docs: Faz 4 telemetri agregasyonu (haftalık)"
          git push

      - name: Yüksek kırılganlık varsa issue aç
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('docs/telemetry/insights.json', 'utf8'));
            const fragile = Object.entries(data.gate_fragility || {})
              .filter(([g, d]) => d.severity === 'high');
            if (fragile.length === 0) return;
            const body = fragile.map(([g, d]) =>
              `### ${g}: %${d.fail_rate * 100} fail oranı\n- ${d.fail}/${d.pass + d.fail} çocukta fail\n- **Kırılgan** — gözden geçir`
            ).join('\n\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📡 Faz 4: ${fragile.length} kırılgan G-kapısı tespit edildi`,
              body: `Haftalık telemetri agregasyonu yüksek fail oranlı kapılar tespit etti:\n\n${body}`,
              labels: ['telemetry', 'gate-fragility']
            });
