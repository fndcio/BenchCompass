# E2E Quick Pipeline — AGENTS.md G6 (hızlı duman testi)
# Her push/PR'da çalışır. Tam E2E = e2e-full-nightly.yml
name: E2E Quick (G6 smoke)

on:
  push:
    branches: [main, master, develop, "feat/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: "G6: E2E Smoke (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: |
          pip install -e ".[dev,e2e]"
          playwright install --with-deps chromium

      # AGENTS.md E2E kuralları grep guard (Y11, Y12, Y13)
      # Desenler ÇAĞRI sözdizimiyle (\( son eki) aranır — docstring'lerde geçen
      # kural açıklamaları (ör. "Y11 — page.route YASAK") yanlış pozitif vermesin.
      # conftest.py hariç tutulur: sunucu fixture'ının sağlık yoklamasındaki
      # time.sleep(0.25) poll ARALIĞIDIR, test-bekleyici değil (Y12 kapsamı dışı).
      - name: E2E kural koruyucusu (grep)
        run: |
          echo "=== page.route( backend mock kontrolü (Y11) ==="
          ! grep -rn "page\.route(" tests/e2e/ --exclude=conftest.py || (echo "❌ page.route YASAK" && exit 1)
          echo "=== time.sleep( kontrolü (Y12) ==="
          ! grep -rn "time\.sleep(" tests/e2e/ --exclude=conftest.py || (echo "❌ time.sleep YASAK" && exit 1)
          echo "=== wait_for_timeout kontrolü (Y12 — 2026-11-05'te 48 borç sıfırlandı) ==="
          if grep -rn "wait_for_timeout(" tests/e2e/ --exclude=conftest.py; then
            echo "❌ wait_for_timeout YASAK — proper waiter kullan (wait_for_function/expect)"
            exit 1
          fi
          echo "✅ E2E kural koruması temiz"

      # Önceden tanımsız requires_ollama/requires_chroma marker'ları filtreleniyordu
      # (ölü filtre — bu marker'lar pyproject/testlerde hiç tanımlı değildi).
      # conftest auto-marker'ı tests/e2e/ altını zaten 'e2e' etiketler.
      - name: E2E smoke çalıştır
        run: pytest tests/e2e/ -x --tb=short
        env:
          CI: "true"

      - name: Başarısızlıkta artifact yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/artifacts/
            .pytest_cache/
          retention-days: 7
