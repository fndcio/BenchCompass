name: Eval Regresyon Kapısı (Haftalık)

on:
  schedule:
    - cron: '0 3 * * 1'    # Her Pazartesi 03:00 UTC
  workflow_dispatch:         # Manuel tetikleme

jobs:
  eval-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" || pip install pytest httpx
          # --timeout=120 için pytest-timeout ŞART: dev ekstrasında yok ve
          # ilk koşumda (2026-11-05, run 41996282851) exit 4 ile 0 test koştu
          pip install pytest-timeout

      - name: Eval plugin testlerini çalıştır (CI Mock Korumalı)
        env:
          CI: "true"
        run: |
          pytest plugin/benchcompass-benchmark-eval/benchcompass_benchmark_eval/tests/ -v --tb=short --timeout=120
